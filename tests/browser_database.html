<!doctype html><html lang="sr-Latn"><meta charset="utf-8"><title>Provera PostgreSQL baze</title><style>body{font:15px Arial;max-width:1050px;margin:40px auto;background:#f7f9fb;color:#183047}pre{white-space:pre-wrap;background:white;border:1px solid #dbe3ea;padding:24px;border-radius:10px}button{padding:12px 18px;background:#285d8e;color:white;border:0;border-radius:7px}a{color:#285d8e}</style><h1>Izolovana provera SQL baze</h1><p>Provera u PostgreSQL WASM engine-u. Auth i Storage sistemske tabele su lokalne zamene. Nema povezivanja sa stvarnim projektom ili poslovnim podacima.</p><button id="run">Pokreni provere</button><pre id="status">Spremno za proveru.</pre><a href="/">Aplikacija</a><script type="module">
const out=document.querySelector('#status'),btn=document.querySelector('#run');
btn.onclick=async()=>{btn.disabled=true;out.textContent='Učitavanje PostgreSQL engine-a…';
try{
 const {PGlite}=await import('https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.16/dist/index.js');
 const db=new PGlite();
 await db.exec(`create role anon nologin; create role authenticated nologin;
 create schema auth; create table auth.users(id uuid primary key,email text,raw_user_meta_data jsonb default '{}'::jsonb);
 create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
 grant usage on schema auth to anon,authenticated; grant execute on function auth.uid() to anon,authenticated;
 create schema storage;
 create table storage.buckets(id text primary key,name text,public boolean,file_size_limit bigint,allowed_mime_types text[]);
 create table storage.objects(id uuid primary key default gen_random_uuid(),bucket_id text,name text);
 alter table storage.objects enable row level security;
 grant usage on schema storage to anon,authenticated;
 grant select,insert,update,delete on storage.objects to anon,authenticated;
 create function storage.foldername(name text) returns text[] language sql immutable as $$ select (string_to_array(name,'/'))[1:array_length(string_to_array(name,'/'),1)-1] $$;
 grant execute on function storage.foldername(text) to anon,authenticated;`);
 const version=await db.query('select version() as version');
 out.textContent=version.rows[0].version+'\nUčitavanje i primena migracije…';
 const schema=await (await fetch('../supabase/schema.sql')).text();
 await db.exec(schema);
 out.textContent+='\nMigracija: PROLAZI\nProvera ponovnog izvršavanja…';
 await db.exec(schema);
 out.textContent+='\nPonovno izvršavanje: PROLAZI\nProvera prava, promena i istorije…';
 const tests=await (await fetch('./rls.sql')).text();
 const result=await db.exec(tests);
 out.textContent+='\nRLS testovi: PROLAZE\n'+JSON.stringify(result.filter(r=>r.rows?.length).map(r=>r.rows),null,2);
 const extended=await (await fetch('./rls_extended.sql')).text();
 await db.exec(extended);
 out.textContent+='\nProširene provere: PROLAZE (izolacija organizacija, privatni prilozi, podela uloga, poslednji administrator).';
 await db.close();out.textContent+='\nZAVRŠENO: USPEŠNO';
}catch(e){out.textContent+='\nGREŠKA: '+e.message+'\n'+JSON.stringify({code:e.code,detail:e.detail,hint:e.hint,where:e.where},null,2);}
finally{btn.disabled=false;}
};
</script></html>
